name: practise ci 
run-name: practise ci

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false

      - name: Run Test
        run: go test -v ./...
        
  build:
    runs-on: ubuntu-latest
    name: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false

      - name: Build Binary
        run: go build -v -o myPractise main.go

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: myPractiseBinary
          path: myPractise
